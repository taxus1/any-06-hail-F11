spring:
  # JDBC 数据源（MyBatis-Plus 走阻塞 JDBC；DB_URL 需为完整 JDBC URL（如 jdbc:mysql://host:3306/db））
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：characterEncoding 只能写 utf8 —— Connector/J 不认 utf8mb4（它不是 JVM 字符集名），
    # 写了会抛 "Unsupported character encoding 'utf8mb4'"。utf8 会被 Connector/J 映射到 utf8mb4。
    url: ${DB_URL:jdbc:mysql://localhost:3306/any_06_hail?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: some-pro-hikari
      # 连接池大小需与 Schedulers.boundedElastic() 的实际并发匹配：
      # 池太小会让 boundedElastic 线程排队等连接，池太大则占用过多 MySQL 连接。
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

logging:
  level:
    com.somepro: debug
