spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 同 dev：characterEncoding 只能写 utf8（Connector/J 不认 utf8mb4）
    url: ${DB_URL:jdbc:mysql://localhost:3306/some_pro_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: some-pro-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:1}

logging:
  level:
    com.somepro: info
