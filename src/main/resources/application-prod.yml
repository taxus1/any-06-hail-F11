spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境不提供默认值，缺失即启动失败（fail-fast）
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: some-pro-hikari
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_IDLE:10}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}

logging:
  level:
    com.somepro: warn
